<!-- Init: apply saved language, remove any old service workers -->
<script>
  // Apply saved language preference
  (function(){
    try{
      var lang=localStorage.getItem('lang');
      if(lang&&window.I18N&&window.I18N[lang]){
        var el=document.getElementById('lg');
        if(el)el.value=lang;
        window.LANG=lang;
        var lm={hi:'hi',mr:'hi',te:'te',ta:'ta',bn:'bn',kn:'kn',gu:'gu',pa:'pa',ml:'ml',or:'or'};
        document.documentElement.lang=lm[lang]||'en';
      }
    }catch(e){}

    // Apply saved theme
    try{
      var theme=localStorage.getItem('theme')||'dark';
      document.documentElement.setAttribute('data-theme',theme);
    }catch(e){}
  })();

  // Unregister old service workers (no caching)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){r.unregister();});
    });
  }
</script>
