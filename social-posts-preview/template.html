function followButton(p){return '<button class="follow" data-follow="'+esc(p.id)+'" aria-pressed="'+follows.has(p.id)+'">'+(follows.has(p.id)?'Following':'Follow')+'</button>';}
function options(values,selected){return values.map(x=>'<option value="'+esc(x)+'" '+(selected===x?'selected':'')+'>'+esc(x)+'</option>').join('');}
function filterPeople(){return PEOPLE.filter(p=>(!state.party||p.party===state.party)&&(!state.region||p.state===state.region)&&(!state.rep||p.id===state.rep)&&(!state.onlyFollowing||follows.has(p.id))&&(!state.query||(p.name+' '+p.handle+' '+p.state+' '+p.party+' '+p.seat).toLowerCase().includes(state.query.toLowerCase())));}
function filterPosts(){const allowed=new Set(PEOPLE.filter(p=>(!state.person||p.id===state.person)&&(!state.rep||p.id===state.rep)&&(!state.party||p.party===state.party)&&(!state.region||p.state===state.region)&&(!state.onlyFollowing||follows.has(p.id))).map(p=>p.id));const r=range(),list=state.view==='saved'?[...(ARCHIVE.posts||[]),...(EMBEDS.posts||[])]:state.mode==='embeds'?EMBEDS.posts||[]:ARCHIVE.posts||[];return [...new Map(list.map(p=>[p.id,p])).values()].filter(p=>allowed.has(p.personId)&&(state.view==='saved'||p.createdAt>=r.start&&p.createdAt<r.end)&&(state.view!=='saved'||saved.has(p.id))&&(!state.query||(p.text+' '+(p.topic||'')+' '+byId.get(p.personId)?.name+' '+byId.get(p.personId)?.handle).toLowerCase().includes(state.query.toLowerCase()))).sort((a,b)=>state.sort==='oldest'?a.createdAt.localeCompare(b.createdAt):b.createdAt.localeCompare(a.createdAt));}
function statusBox(){if(state.mode==='embeds')return '<div class="status">'+icon('info')+'<div><strong>10 representatives · 10 sourced post links</strong>27–31 October 2026. Selected posts, not a complete archive. X supplies the embedded content; original links remain available if an embed fails. <button class="inline-link" data-action="embed-coverage">Sources & coverage</button></div></div>';const total=(ARCHIVE.posts||[]).length,done=(ARCHIVE.coverage||[]).filter(c=>c.status==='complete').length;return '<div class="status">'+icon('info')+'<div><strong>'+(ARCHIVE.fetchedAt?total.toLocaleString('en-IN')+' imported posts · '+done+'/100 accounts completed':'The 30-day post archive is not connected yet')+'</strong>'+(ARCHIVE.fetchedAt?'Imported '+esc(date(ARCHIVE.fetchedAt))+'. Coverage is limited to public posts returned by X.':'Browse all 100 representatives below, or open their X timeline. Imported posts will appear here after connection.')+' <button class="inline-link" data-action="coverage">View coverage</button></div></div>';}
function period(){const r=range();return '<div class="period">'+icon('clock')+'<span>'+esc(date(r.start))+' – '+esc(date(r.end))+' · '+(state.mode==='embeds'?'selected five-day snapshot':'30-day archive')+'</span></div>';}
function filters(){return '<div class="search">'+icon('search')+'<input id="search" type="search" placeholder="Search posts or representatives" aria-label="Search posts or representatives" value="'+esc(state.query)+'"></div><div class="row between"><button class="btn" data-action="filters" aria-expanded="'+!document.querySelector('#filter-panel')?.hidden+'">'+icon('filter')+'Filters'+((state.party||state.region||state.rep)?' •':'')+'</button><select id="sort" class="select" aria-label="Sort posts"><option value="latest" '+(state.sort==='latest'?'selected':'')+'>Latest first</option><option value="oldest" '+(state.sort==='oldest'?'selected':'')+'>Oldest first</option></select></div><div id="filter-panel" class="filters" hidden><label>Representative<select id="rep-filter"><option value="">All 100 representatives</option>'+PEOPLE.map(p=>'<option value="'+esc(p.id)+'" '+(state.rep===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label>Party<select id="party-filter"><option value="">All parties</option>'+options([...new Set(PEOPLE.map(p=>p.party))].sort(),state.party)+'</select></label><label>State / UT<select id="region-filter"><option value="">All states & UTs</option>'+options([...new Set(PEOPLE.map(p=>p.state))].sort(),state.region)+'</select></label></div>'+((state.party||state.region||state.rep)?'<div class="chips">'+[state.party,state.region,byId.get(state.rep)?.name].filter(Boolean).map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'<button class="inline-link" data-action="clear">Clear all</button></div>':'');}
function mini(p){return '<div class="mini">'+avatar(p)+'<div class="text"><button class="name" data-person="'+esc(p.id)+'"><strong>'+esc(p.name)+'</strong></button><span>'+esc(p.state)+'</span></div>'+followButton(p)+'</div>';}
function rightRail(){const preferred=PEOPLE.filter(p=>follows.has(p.id));const list=(preferred.length?preferred:PEOPLE).slice(0,5);return '<aside class="right-rail stack"><section class="card"><div class="row between"><h3>'+(preferred.length?'Your follows':'People to follow')+'</h3><span class="badge">'+follows.size+'</span></div><div class="mini-list">'+list.map(mini).join('')+'</div><button class="btn subtle" style="width:100%;margin-top:20px" data-action="people">Explore all 100 '+icon('arrow')+'</button></section><section class="card"><h3>From the source</h3><p class="aside-note">Account links are recorded in parliamentary biographies. Posts keep their original X links.</p><button class="inline-link" data-action="coverage">Archive coverage '+icon('arrow')+'</button></section></aside>';}
function personCard(p){return '<button class="person-card" data-person="'+esc(p.id)+'"><span class="row">'+avatar(p)+'<span><span class="person-name">'+esc(p.name)+'</span><span class="small">'+esc(p.house)+' · '+esc(p.state)+'</span><span class="small" style="color:var(--blue)">@'+esc(p.handle)+'</span></span></span></button>';}
function spotlights(){return '<div class="spotlight" aria-label="Featured representatives">'+PEOPLE.slice(0,12).map(p=>'<button class="spot" data-person="'+esc(p.id)+'">'+avatar(p)+'<span>'+esc(p.name.split(' ').slice(0,2).join(' '))+'</span></button>').join('')+'</div>';}
function postCard(post){if(post.embed)return embedCard(post);const p=byId.get(post.personId);return '<article class="post"><div class="head">'+avatar(p)+'<div class="byline"><button class="author" data-person="'+esc(p.id)+'">'+esc(p.name)+'</button><div class="meta">@'+esc(p.handle)+' · '+esc(date(post.createdAt))+'</div></div><span class="platform" aria-label="X">𝕏</span></div>'+(post.kind&&post.kind!=='post'?'<div class="small" style="margin-top:8px">'+esc(post.kind==='retweeted'?'Reposted on X':post.kind==='replied_to'?'Reply on X':'Quoted on X')+'</div>':'')+'<p class="post-body">'+esc(post.text)+'</p>'+((post.media||[]).length?'<div class="post-media">'+post.media.map(m=>m.type==='photo'&&safeURL(m.url)?'<img loading="lazy" src="'+esc(safeURL(m.url))+'" alt="'+esc(m.alt||'Image attached to the original X post')+'">':safeURL(m.preview)?'<a href="'+esc(safeURL(post.url))+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(safeURL(m.preview))+'" alt="Video preview — watch on X"></a>':'').join('')+'</div>':'')+'<footer class="post-footer"><a href="'+esc(safeURL(post.url))+'" target="_blank" rel="noopener">View on X ↗</a><div class="actions"><button data-save="'+esc(post.id)+'" class="'+(saved.has(post.id)?'saved':'')+'" aria-label="'+(saved.has(post.id)?'Unsave':'Save')+' post" aria-pressed="'+saved.has(post.id)+'">'+icon('bookmark')+'</button><button data-share="'+esc(post.id)+'" aria-label="Share post">'+icon('share')+'</button></div></footer></article>';}
function emptyFeed(){const p=byId.get(state.person||state.rep);return '<section class="empty"><div class="empty-icon">'+icon(state.view==='saved'?'bookmark':'news')+'</div><h3>'+(state.view==='saved'?'No saved posts in this view':ARCHIVE.fetchedAt?'No matching imported posts':'Ready for real posts')+'</h3><p>'+(state.view==='saved'?'Save posts using the bookmark icon. Try clearing filters if a saved post is hidden.':ARCHIVE.fetchedAt?'Try another representative or clear your filters. Check coverage before interpreting an empty feed.':'The representatives are loaded. Their past 30 days of X posts need an archive import before they can be displayed here.')+'</p><div class="row wrap" style="justify-content:center">'+(p?'<button class="btn primary" data-action="timeline">Open X timeline</button>':'<button class="btn primary" data-action="people">Browse 100 representatives</button>')+'<button class="btn" data-action="settings">Import posts</button></div></section>';}
function feed(){const posts=filterPosts();return '<div class="feed-title"><h2>'+(state.view==='saved'?'Saved posts':state.person?'Posts on X':'From representatives')+'</h2><span class="count">'+posts.length.toLocaleString('en-IN')+(state.mode==='embeds'?' sourced links':' imported')+'</span></div>'+(!posts.length?emptyFeed():posts.slice(0,state.limit).map(postCard).join('')+(posts.length>state.limit?'<button class="btn loadmore" data-action="more">Load more posts</button>':''));}
function news(){const live=state.mode==='timeline'&&state.view!=='saved';return '<div class="heading"><div class="eyebrow">Electrol India / Social desk</div><h1>'+(state.view==='saved'?'Saved posts':state.view==='following'?'Your follows':'News')+'</h1><p class="muted">Public updates. Connected to the people behind them.</p></div><div class="layout"><div class="stack"><div class="segment" aria-label="Social desk view"><button data-action="news" class="'+(state.view==='news'?'active':'')+'">Social posts</button><button data-action="following" class="'+(state.view==='following'?'active':'')+'">Following</button><button data-action="saved" class="'+(state.view==='saved'?'active':'')+'">Saved</button></div>'+(state.view!=='saved'?'<div class="chips" aria-label="Post source"><button class="pill '+(state.mode==='embeds'?'active':'')+'" data-mode="embeds">5-day embeds</button><button class="pill '+(live?'active':'')+'" data-mode="timeline">X timelines</button><button class="pill '+(state.mode==='feed'?'active':'')+'" data-mode="feed">30-day archive</button></div>':'')+'<div class="filterbar">'+filters()+(!live?period():'')+'</div>'+spotlights()+(live?liveFeed():statusBox()+feed())+'</div>'+rightRail()+'</div>';}
function directory(){const people=filterPeople();return '<div class="heading"><div class="eyebrow">Electrol India / Representatives</div><h1>People behind the posts.</h1><p class="muted">100 representatives. Recorded X accounts. One place to explore.</p></div><div class="layout"><div class="stack"><div class="filterbar">'+filters()+'</div><div class="feed-title"><h2>Representatives</h2><span class="count">'+people.length+' of 100</span></div><div class="people-grid">'+(people.length?people.slice(0,state.limit).map(personCard).join(''):'<p class="muted">No representatives match. Clear your filters.</p>')+'</div>'+(people.length>state.limit?'<button class="btn loadmore" data-action="more">Show more representatives</button>':'')+'</div>'+rightRail()+'</div>';}
function profile(){const p=byId.get(state.person);const coverage=(ARCHIVE.coverage||[]).find(x=>x.personId===p.id);return '<button class="back" data-action="back">'+icon('back')+'Back to '+(previousView==='people'?'representatives':'social posts')+'</button><section class="hero card">'+avatar(p)+'<div class="hero-info"><h1>'+esc(p.name)+'</h1><div class="muted">'+esc(p.role)+'</div><div class="muted">'+esc(p.seat)+(p.seat!==p.state?', '+esc(p.state):'')+'</div><button class="btn primary" data-follow="'+esc(p.id)+'" aria-pressed="'+follows.has(p.id)+'">'+(follows.has(p.id)?'Following':'Follow')+'</button></div><div class="social"><div class="small" style="margin-bottom:8px">Recorded X account</div><a class="row" href="https://x.com/'+esc(p.handle)+'" target="_blank" rel="noopener"><span class="account-icon">𝕏</span>@'+esc(p.handle)+' ↗</a></div></section><nav class="tabs" aria-label="Representative sections">'+['overview','posts','details'].map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'<a href="'+esc(safeURL(p.source))+'" style="padding:12px 0;white-space:nowrap;font-size:12px" target="_blank" rel="noopener">Parliament profile ↗</a></nav><div class="layout"><div class="stack">'+(state.tab==='posts'?'<div class="segment"><button data-mode="embeds" class="'+(state.mode==='embeds'?'active':'')+'">5-day posts</button><button data-mode="feed" class="'+(state.mode==='feed'?'active':'')+'">Archive</button><button data-mode="timeline" class="'+(state.mode==='timeline'?'active':'')+'">Timeline</button></div>'+ (state.mode!=='timeline'?period()+statusBox()+feed():timelinePanel(p)):state.tab==='overview'?'<section class="card"><h2 class="section-title">At a glance</h2><dl class="facts">'+Object.entries({House:p.house,Constituency:p.seat,'State / UT':p.state,Party:p.party,'Recorded X account':'@'+p.handle}).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl></section><section class="card"><h3>Post archive</h3><p class="muted">'+(coverage?'Import status: '+esc(coverage.status)+'. '+(coverage.count||0)+' posts returned.':'No archive import has been completed for this representative.')+'</p><button class="btn subtle" data-tab="posts">View posts</button></section>':'<section class="card"><h2 class="section-title">Parliamentary biography</h2><dl class="facts">'+Object.entries(p.details).filter(([,v])=>v).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl><p class="small" style="margin-top:20px">Recorded in your parliamentary data · reviewed '+esc(p.reviewed)+'.</p><a href="'+esc(safeURL(p.source))+'" target="_blank" rel="noopener">Open source biography ↗</a></section>')+'</div><aside class="right-rail stack"><section class="card"><h3>Social account</h3><div class="mini-list"><a class="row" href="https://x.com/'+esc(p.handle)+'" target="_blank" rel="noopener"><span class="account-icon">𝕏</span>@'+esc(p.handle)+' ↗</a></div><p class="aside-note">Recorded in the parliamentary biography. Current account ownership has not been rechecked.</p></section><section class="card"><h3>Constituency</h3><p class="aside-note">'+esc(p.seat)+'<br>'+esc(p.state)+' · '+esc(p.house)+'</p><a href="'+esc(safeURL(p.source))+'" class="btn subtle" target="_blank" rel="noopener">Parliament profile ↗</a></section></aside></div>';}
function liveFeed(){const people=filterPeople();if(!people.length)return '<section class="empty"><h3>No matching representatives</h3><p>Follow a representative or clear your filters to see their X timeline.</p><button class="btn" data-action="people">Browse representatives</button></section>';const p=people.find(p=>p.id===state.timelinePerson)||people[0];state.timelinePerson=p.id;return timelinePanel(p,true);}
function timelinePanel(p,selector=false){const start=new Date(range().start).toISOString().slice(0,10),end=new Date(Date.parse(range().end)+86400000).toISOString().slice(0,10);const search='https://x.com/search?q='+encodeURIComponent('from:'+p.handle+' since:'+start+' until:'+end)+'&f=live';return '<section class="card"><div class="row between"><div><h3>'+esc(p.name)+'</h3><p class="small">@'+esc(p.handle)+'</p></div><a href="https://x.com/'+esc(p.handle)+'" class="btn subtle" target="_blank" rel="noopener">View on X ↗</a></div>'+(selector?'<label class="small" style="display:grid;gap:6px;margin:12px 0">Choose a representative<select id="timeline-person" class="select" style="width:100%;max-width:none">'+filterPeople().map(q=>'<option value="'+esc(q.id)+'" '+(q.id===p.id?'selected':'')+'>'+esc(q.name)+' · @'+esc(q.handle)+'</option>').join('')+'</select></label>':'')+'<p class="small">Public X timeline · supplied by X, not restricted to 30 days. Loading connects to X; sign-in or browser restrictions may affect availability.</p><div class="timeline-box" id="timeline" data-person="'+esc(p.id)+'"><p class="small" role="status">Loading posts from X…</p><a href="https://x.com/'+esc(p.handle)+'" target="_blank" rel="noopener">Open @'+esc(p.handle)+' on X ↗</a></div><div class="row wrap" style="margin-top:14px"><a class="btn" style="font-size:12px" href="'+esc(search)+'" target="_blank" rel="noopener">Date search on X ↗</a><button class="inline-link" data-mode="feed">View 30-day archive</button></div></section>';}
function render(){document.querySelector('#main').innerHTML=state.person?profile():state.view==='people'?directory():news();document.querySelector('#breadcrumb').textContent=state.person?'Representatives / '+byId.get(state.person).name:state.view==='people'?'Representatives / X accounts':'News / Social posts';document.title=(state.person?byId.get(state.person).name+' · Posts':'Social desk')+' · Electrol India';document.querySelectorAll('[data-view]').forEach(b=>{const active=!state.person&&b.dataset.view===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));if(document.querySelector('#timeline'))setTimeout(()=>loadTimeline(),0);mountEmbeds();}
function dialog(content){const d=document.querySelector('#dialog');document.querySelector('#dialog-content').innerHTML='<div class="dialog-body"><div class="row between"><h2>Social desk</h2><button class="circle" data-action="close" aria-label="Close dialog">'+icon('close')+'</button></div>'+content+'</div>';if(!d.open)d.showModal();}
function settings(){dialog('<h3>Appearance</h3><div class="segment">'+['light','dark','system'].map(t=>'<button data-theme-choice="'+t+'" class="'+(theme===t?'active':'')+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><h3>Post archive</h3><p>Load a posts.json file produced by the included X importer. This file uses the public posts returned by X for the selected 30-day period. API credentials stay on your computer.</p><button class="btn primary" data-action="import">'+icon('download')+'Import posts.json</button><button class="btn" data-action="coverage">View account coverage</button><div class="note-box">The HTML opens directly without installation. Following and bookmarks are saved on this device. A copied HTML includes the last archive embedded when it was built.</div>');}
function coverage(){dialog('<h3>Archive coverage</h3><p>'+((ARCHIVE.posts||[]).length)+' imported posts · '+PEOPLE.length+' representatives. “Not imported” is different from zero posts.</p>'+period()+'<div style="max-height:360px;overflow:auto">'+PEOPLE.map(p=>{const c=(ARCHIVE.coverage||[]).find(c=>c.personId===p.id);return '<div class="coverage-row"><strong>'+esc(p.name)+'</strong><br>'+esc(c?.status||'Not imported')+(c?' · '+Number(c.count||0)+' posts':'')+(c?.note?'<br>'+esc(c.note):'')+'</div>';}).join('')+'</div><button class="btn primary" data-action="import">Import posts.json</button>');}
let previousView='news',previousFilters;
function go(view){state.view=view;state.person=null;state.limit=20;state.onlyFollowing=view==='following';state.mode=(EMBEDS.posts?.some(p=>p.personId===state.person)||!state.person?'embeds':ARCHIVE.posts?.length?'feed':'timeline');state.rep='';state.query='';state.party='';state.region='';location.hash=view;render();scrollTo(0,0);}
function openPerson(id){if(!byId.has(id))return;if(!state.person){previousView=state.view;previousFilters={query:state.query,rep:state.rep,party:state.party,region:state.region,onlyFollowing:state.onlyFollowing};}state.person=id;state.query='';state.rep='';state.party='';state.region='';state.onlyFollowing=false;state.tab='posts';state.mode=(EMBEDS.posts?.some(p=>p.personId===state.person)||!state.person?'embeds':ARCHIVE.posts?.length?'feed':'timeline');state.limit=20;location.hash='representative='+encodeURIComponent(id);render();scrollTo(0,0);}
function back(){state.person=null;state.view=previousView;Object.assign(state,previousFilters||{});state.limit=20;location.hash=state.view;render();scrollTo(0,0);}
async function loadTimeline(){const box=document.querySelector('#timeline'),p=box&&byId.get(box.dataset.person);if(!p||!box||box.dataset.pending==='1')return;box.dataset.pending='1';const key=p.id;const unavailable=()=>{if(box.isConnected)box.innerHTML='<div class="note-box"><strong>X could not display posts here.</strong><p style="margin-top:7px">This is an X embed restriction, not evidence that this representative has no posts. Open the original account to read them.</p><div class="row wrap" style="margin-top:12px"><a class="btn primary" href="https://x.com/'+esc(p.handle)+'" target="_blank" rel="noopener">Read posts on X ↗</a><button class="btn" data-action="load-timeline">Retry</button></div></div>';};let timer;try{const widgets=await widgetsAPI();if(!box.isConnected||box.dataset.person!==key)return;box.innerHTML='';await Promise.race([widgets.createTimeline({sourceType:'profile',screenName:p.handle},box,{height:650,theme:document.documentElement.dataset.theme,dnt:true,chrome:'noheader nofooter',ariaPolite:'polite'}),new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('Timeline timeout')),16000))]);if(!box.isConnected)return;if(!box.querySelector('iframe'))throw Error('No timeline available');}catch{widgetLoad=null;unavailable();}finally{clearTimeout(timer);delete box.dataset.pending;}}
function validateArchive(data){const iso=s=>typeof s==='string'&&Number.isFinite(Date.parse(s))&&new Date(s).toISOString()===s;if(!data||data.schema!==1||!Array.isArray(data.posts)||!Array.isArray(data.coverage)||!data.range||!iso(data.range.start)||!iso(data.range.end)||data.range.start>=data.range.end)throw Error('Use posts.json produced by the included importer.');if(data.fetchedAt&&!iso(data.fetchedAt))throw Error('Invalid archive timestamp.');if(data.posts.length>100000)throw Error('Archive exceeds 100,000 posts.');if(data.coverage.some(c=>!c||!byId.has(c.personId)||typeof c.status!=='string'||(c.note&&typeof c.note!=='string')))throw Error('Invalid account coverage.');const seen=new Set();for(const p of data.posts){const person=p&&byId.get(p.personId);if(!person||typeof p.id!=='string'||!/^\d{1,30}$/.test(p.id)||seen.has(p.id)||typeof p.text!=='string'||!iso(p.createdAt))throw Error('Invalid or duplicate post.');seen.add(p.id);const u=new URL(p.url);if(u.hostname!=='x.com'||u.pathname.toLowerCase()!==('/'+person.handle+'/status/'+p.id).toLowerCase()||u.protocol!=='https:'||u.username||u.password||u.port||u.search||u.hash)throw Error('Post URL does not match its representative.');if(p.createdAt<data.range.start||p.createdAt>=data.range.end)throw Error('Post falls outside the import period.');if(p.media&&(!Array.isArray(p.media)||p.media.some(m=>!m||typeof m.type!=='string'||(m.url&&typeof m.url!=='string')||(m.preview&&typeof m.preview!=='string'))))throw Error('Invalid media.');}return data;}

function embedCard(post){const p=byId.get(post.personId);return '<article class="post"><div class="head">'+avatar(p)+'<div class="byline"><button class="author" data-person="'+esc(p.id)+'">'+esc(p.name)+'</button><div class="meta">@'+esc(p.handle)+' · '+esc(date(post.createdAt))+'</div></div><span class="platform" aria-label="X">𝕏</span></div><p class="small" style="margin-top:12px">'+esc(post.topic)+'</p><div class="x-post-embed" data-post-id="'+esc(post.id)+'" style="min-height:140px"><p class="small" role="status">Loading original post from X…</p><a href="'+esc(post.url)+'" target="_blank" rel="noopener">Read original post on X ↗</a></div><footer class="post-footer"><a href="'+esc(post.url)+'" target="_blank" rel="noopener">View on X ↗</a><div class="actions"><button data-save="'+esc(post.id)+'" class="'+(saved.has(post.id)?'saved':'')+'" aria-label="Save post" aria-pressed="'+saved.has(post.id)+'">'+icon('bookmark')+'</button><button data-share="'+esc(post.id)+'" aria-label="Share post">'+icon('share')+'</button></div></footer><a class="small" href="'+esc(safeURL(post.source))+'" target="_blank" rel="noopener">Source of this post link ↗</a></article>';}
function embedCoverage(){dialog('<h3>Five-day snapshot</h3><p>27–31 October 2026 · 10 selected links for 10 representatives. This does not establish complete account coverage. Post dates are derived from X post IDs and checked against the dated linking source. X access and playback were blocked during collection.</p><div style="max-height:400px;overflow:auto">'+(EMBEDS.posts||[]).map(p=>'<div class="coverage-row"><strong>'+esc(byId.get(p.personId).name)+'</strong><br>'+esc(p.createdAt)+'<br>'+esc(p.sourceNote)+'<br><a href="'+esc(safeURL(p.source))+'" target="_blank" rel="noopener">Link source ↗</a> · <a href="'+esc(p.url)+'" target="_blank" rel="noopener">Original post ↗</a></div>').join('')+'</div>');}
function widgetsAPI(){if(window.twttr?.widgets)return Promise.resolve(window.twttr.widgets);if(widgetLoad)return widgetLoad;widgetLoad=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://platform.twitter.com/widgets.js';s.async=true;const timer=setTimeout(()=>reject(Error('X did not respond')),14000);s.onload=()=>window.twttr?.ready(t=>{clearTimeout(timer);resolve(t.widgets);});s.onerror=()=>{clearTimeout(timer);s.remove();reject(Error('X is unavailable'));};document.head.append(s);}).catch(e=>{widgetLoad=null;throw e;});return widgetLoad;}
let embedObserver;
function mountEmbeds(){embedObserver?.disconnect();embedObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){embedObserver.unobserve(e.target);loadPostEmbed(e.target);}}, {rootMargin:'250px'});document.querySelectorAll('.x-post-embed').forEach(el=>embedObserver.observe(el));}
async function loadPostEmbed(box){const post=(EMBEDS.posts||[]).find(p=>p.id===box.dataset.postId);if(!post||box.dataset.pending)return;box.dataset.pending='1';let timer;try{const w=await widgetsAPI();if(!box.isConnected)return;box.innerHTML='';await Promise.race([w.createTweet(post.id,box,{theme:document.documentElement.dataset.theme,dnt:true,conversation:'none',align:'center'}),new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('X timeout')),16000))]);if(box.isConnected&&!box.querySelector('iframe'))throw Error('Embed unavailable');}catch{if(box.isConnected)box.innerHTML='<div class="note-box"><p>X could not render this post here. The source link is retained below; this is not a claim that the post was deleted.</p><a class="btn subtle" style="margin-top:12px" href="'+esc(post.url)+'" target="_blank" rel="noopener">Read original on X ↗</a></div>';}finally{clearTimeout(timer);delete box.dataset.pending;}}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.person)return openPerson(b.dataset.person);if(b.dataset.themeChoice)return applyTheme(b.dataset.themeChoice);if(b.dataset.follow){const id=b.dataset.follow;follows.has(id)?follows.delete(id):follows.add(id);store.set('follows',[...follows]);render();return;}if(b.dataset.save){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);store.set('saved',[...saved]);render();return;}if(b.dataset.share){const p=[...(ARCHIVE.posts||[]),...(EMBEDS.posts||[])].find(p=>p.id===b.dataset.share);try{if(navigator.share)await navigator.share({url:p.url});else if(navigator.clipboard){await navigator.clipboard.writeText(p.url);toast('Post link copied');}else{dialog('<h3>Share post</h3><a href="'+esc(safeURL(p.url))+'" target="_blank" rel="noopener">'+esc(p.url)+'</a>');}}catch{}return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}if(b.dataset.mode){state.mode=b.dataset.mode;render();return;}switch(b.dataset.action){case 'news':case 'people':case 'following':case 'saved':go(b.dataset.action);break;case 'back':back();break;case 'settings':settings();break;case 'coverage':coverage();break;case 'embed-coverage':embedCoverage();break;case 'close':document.querySelector('#dialog').close();break;case 'import':document.querySelector('#load-file').click();break;case 'theme':applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');break;case 'filters':{const panel=document.querySelector('#filter-panel');panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',!panel.hidden);break;}case 'clear':state.party=state.region=state.rep=state.query='';state.limit=20;render();break;case 'more':state.limit+=20;render();break;case 'timeline':state.mode='timeline';render();break;case 'load-timeline':await loadTimeline();break;}});
document.addEventListener('change',e=>{if(e.target.id==='timeline-person'){state.timelinePerson=e.target.value;render();return;}const key=({'rep-filter':'rep','party-filter':'party','region-filter':'region',sort:'sort'})[e.target.id];if(key){const wasOpen=!document.querySelector('#filter-panel')?.hidden;state[key]=e.target.value;state.limit=20;render();const p=document.querySelector('#filter-panel');if(p&&wasOpen){p.hidden=false;document.querySelector('[data-action=filters]')?.setAttribute('aria-expanded','true');}}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id!=='search')return;const start=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=e.target.value;state.limit=20;render();const el=document.querySelector('#search');el.focus();el.setSelectionRange(start,start);},160);});
document.querySelector('#top-search').addEventListener('submit',e=>{e.preventDefault();const q=e.target.querySelector('input').value;go('people');state.query=q;render();});
document.querySelector('#load-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>50*1024*1024)throw Error('Archive must be under 50 MB.');ARCHIVE=validateArchive(JSON.parse(await file.text()));state.mode='feed';document.querySelector('#dialog').close();state.limit=20;render();toast('Imported '+ARCHIVE.posts.length+' posts');}catch(err){toast(err.message||'Unable to import archive');}finally{e.target.value='';}});
function readRoute(){const hash=location.hash.slice(1);if(hash.startsWith('representative=')){const id=decodeURIComponent(hash.split('=')[1]||'');if(byId.has(id)){state.person=id;state.tab='posts';state.mode=(EMBEDS.posts?.some(p=>p.personId===state.person)||!state.person?'embeds':ARCHIVE.posts?.length?'feed':'timeline');state.query=state.rep=state.party=state.region='';state.onlyFollowing=false;}}else if(['news','people','following','saved'].includes(hash)){state.person=null;state.view=hash;state.onlyFollowing=hash==='following';}render();}
addEventListener('hashchange',()=>{if(state.person&&location.hash==='#representative='+encodeURIComponent(state.person))return;if(!state.person&&location.hash==='#'+state.view)return;readRoute();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(theme==='system')applyTheme('system');});
applyTheme(['light','dark','system'].includes(theme)?theme:'system');readRoute();
window.ElectrolSocial={people:PEOPLE,embeds:EMBEDS,getArchive:()=>ARCHIVE,validateArchive,filterPosts,filterPeople,state,openPerson,go,applyTheme};
</script></body></html>
